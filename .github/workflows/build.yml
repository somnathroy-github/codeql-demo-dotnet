name: .NET Code Coverage

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x' # Change this to your .NET version

    - name: Restore dependencies
      run: |
          dotnet restore MyConsoleApp/MyConsoleApp.csproj
          dotnet restore MyConsoleApp.Tests/MyConsoleApp.Tests.csproj

    - name: Restore dependencies
      run: |
          dotnet restore MyConsoleApp/MyConsoleApp.csproj
          dotnet restore MyConsoleApp.Tests/MyConsoleApp.Tests.csproj

    - name: Build
      run: dotnet build MyConsoleApp/MyConsoleApp.csproj --configuration Release

    - name: Test with coverage
      run: |
        dotnet test MyConsoleApp.Tests/MyConsoleApp.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura 
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"MyConsoleApp.Tests/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:Html
    - name: Cache coverage report
      uses: actions/cache@v3
      with:
        path: coverage-report
        key: ${{ runner.os }}-coverage-report-${{ hashFiles('MyConsoleApp.Tests/coverage.cobertura.xml') }}
        restore-keys: |
          ${{ runner.os }}-coverage-report-
      
    - name: Set coverage file path
      id: set-coverage-path
      run: echo "coverage_path=$(find ./MyConsoleApp.Tests -name 'coverage.cobertura.xml')" >> $GITHUB_ENV
    
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: output/test/code-coverage.html
      
    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: coverage-report/index.html